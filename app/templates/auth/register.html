{% extends "base.html" %}
{% block title %}Register · LabGemma{% endblock %}
{% block body %}
<div class="auth-shell">
  <div class="auth-panel auth-panel--register">
    <div class="auth-intro">
      <h1>Create account</h1>
      <p class="lede">Teachers author labs. Students solve and get marked</p>
    </div>

    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}

    <form method="post" action="/register" id="register-form">
      <label for="name">Name</label>
      <input id="name" name="name" required placeholder="Enter your name" autocomplete="name" />

      <label for="email">Email</label>
      <input id="email" type="email" name="email" required placeholder="Enter your email" autocomplete="email" />

      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" type="password" name="password" required minlength="6" placeholder="Enter your password" autocomplete="new-password" />
        <button type="button" class="password-toggle" id="togglePass" aria-label="Show password" title="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <label for="role">I am a</label>
      <select id="role" name="role">
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
      </select>

      <div class="auth-actions">
        <button class="btn btn-primary" type="submit">Create account</button>
      </div>
    </form>

    <p class="auth-foot"><a href="/login">Already registered? Sign in</a></p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const passEl = document.getElementById('password');
const toggle = document.getElementById('togglePass');
toggle.addEventListener('click', () => {
  const show = passEl.type === 'password';
  passEl.type = show ? 'text' : 'password';
  toggle.classList.toggle('is-on', show);
  toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  toggle.title = show ? 'Hide password' : 'Show password';
});
</script>
{% endblock %}
